<!doctype html>
<html lang="pt">
  <meta charset="utf-8" /><meta name="robots" content="noindex" /><title>
    Executor
  </title>
  <script type="module">
    let worker;
    let preparedPython;
    const pythonWorkers = new Set();
    const preparePython = () => {
      if (preparedPython) return preparedPython;
      const worker = new Worker('./python.worker.js', { type: 'module' });
      pythonWorkers.add(worker);
      const entry = { worker, ready: false, receive: undefined };
      entry.preparation = new Promise((resolve, reject) => {
        entry.cancelPreparation = () =>
          reject(new Error('Preparação interrompida.'));
        worker.onmessage = ({ data }) => {
          if (data.type === 'ready') {
            entry.ready = true;
            resolve();
          } else if (entry.receive) entry.receive(data);
          else if (data.type === 'error') reject(new Error(data.text));
        };
        worker.onerror = () => {
          const text =
            'Não foi possível carregar o motor. Verifica a ligação e tenta novamente.';
          if (entry.receive) entry.receive({ type: 'error', text });
          else reject(new Error(text));
        };
      });
      // Preparation may fail before an editor asks for it.
      entry.preparation.catch(() => {
        if (preparedPython === entry) preparedPython = undefined;
        worker.terminate();
        pythonWorkers.delete(worker);
      });
      preparedPython = entry;
      return entry;
    };
    window.addEventListener('message', (event) => {
      if (event.source !== parent || !event.ports[0]) return;
      if (
        !['https://resumos.rgo.pt', 'https://resumos-feup.pages.dev'].includes(
          event.origin,
        ) &&
        !/^http:\/\/(localhost|127\.0\.0\.1):\d+$/.test(event.origin)
      )
        return;
      const { language, code, input, files, type } = event.data || {};
      const port = event.ports[0];
      if (language === 'python' && type === 'prepare') {
        const entry = preparePython();
        entry.preparation.then(
          () => {
            port.postMessage({ type: 'ready' });
            port.close();
          },
          (error) => {
            port.postMessage({ type: 'error', text: error.message });
            port.close();
          },
        );
        return;
      }
      if (
        ![
          'python',
          'haskell',
          'prolog',
          'php',
          'sql',
          'sqlite',
          'postgresql',
        ].includes(language) ||
        typeof code !== 'string' ||
        typeof input !== 'string'
      )
        return;
      if (
        files !== undefined &&
        (typeof files !== 'object' || files === null || Array.isArray(files))
      )
        return;
      if (language === 'python') {
        const entry = preparePython();
        preparedPython = undefined;
        let cancelled = false;
        port.onmessage = ({ data }) => {
          if (data?.type !== 'cancel') return;
          cancelled = true;
          entry.cancelPreparation();
          entry.worker.terminate();
          pythonWorkers.delete(entry.worker);
          port.close();
        };
        if (!entry.ready)
          port.postMessage({ type: 'status', text: 'A carregar o motor…' });
        entry.preparation.then(
          () => {
            if (cancelled) return;
            entry.receive = (data) => {
              port.postMessage(data);
              if (data.type !== 'done' && data.type !== 'error') return;
              entry.worker.terminate();
              pythonWorkers.delete(entry.worker);
              port.close();
            };
            entry.worker.postMessage({ code, input, files });
          },
          (error) => {
            if (cancelled) return;
            port.postMessage({ type: 'error', text: error.message });
            port.close();
          },
        );
        // Only a pristine standby is shared. A worker that ran reader code
        // is always terminated, including after success and cancellation.
        preparePython();
        return;
      }
      if (worker) return;
      worker = new Worker(
        `./${language === 'sql' ? 'sqlite' : language}.worker.js`,
        language === 'prolog' ? {} : { type: 'module' },
      );
      worker.onmessage = ({ data }) => {
        if (data.type !== 'ready') port.postMessage(data);
      };
      worker.onerror = () =>
        port.postMessage({
          type: 'error',
          text: 'Não foi possível carregar o motor. Verifica a ligação e tenta novamente.',
        });
      worker.postMessage({ code, input, files });
    });
    window.addEventListener('pagehide', () => {
      worker?.terminate();
      for (const python of pythonWorkers) python.terminate();
      pythonWorkers.clear();
    });
  </script>
</html>
