<form id="reserva">
  <fieldset>
    <legend>Reservar um livro</legend>
    <label for="nome">Nome</label>
    <input id="nome" name="nome" value="Ana" required />
    <label for="quantidade">Quantidade</label>
    <input
      id="quantidade"
      name="quantidade"
      type="number"
      min="1"
      max="3"
      value="2"
      required
    />
    <label
      ><input type="checkbox" name="aviso" value="sim" /> Receber aviso</label
    >
    <button type="submit">Ver os dados</button>
  </fieldset>
</form>
<pre id="dados" aria-live="polite">nome=Ana&amp;quantidade=2</pre>
